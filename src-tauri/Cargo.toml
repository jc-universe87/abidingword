[package]
name = "abiding-word"
version = "0.1.0"
description = "Abiding Word — Bible Study Workspace"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# The library holds all native logic so integration tests can use it directly.
name = "abiding_word_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so users need nothing installed.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
log = "0.4"
regex = "1"
# Concordance (v0.12): canonical composition and combining-mark tests.
unicode-normalization = "0.1"
# Library v0.4 importers (pure Rust, offline).
pdf-extract = "0.12"
lopdf = "0.42"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
sha2 = "0.10"
# Reads .zip Bible downloads; only standard (deflate) compression is needed.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# Assistant (v0.16): requests to the AI, search and image services the person
# configured. Already used by the updater; no new TLS stack.
base64 = "0.22"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# API keys live in the operating system's credential store, never in the database.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Presentation exports (v0.18): PDF streams, PNG images in PDFs and the
# computer's own TrueType fonts (all already used by other dependencies).
flate2 = "1"
png = "0.18"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
# The mock runtime, to check each window's command permissions (v0.18.3).
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
