[package]
name = "abiding-word"
version = "0.1.0"
description = "Abiding Word — Bible Study Workspace"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# The library holds all native logic so integration tests can use it directly.
name = "abiding_word_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so users need nothing installed.
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
log = "0.4"
regex = "1"
# Reads .zip Bible downloads; only standard (deflate) compression is needed.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
